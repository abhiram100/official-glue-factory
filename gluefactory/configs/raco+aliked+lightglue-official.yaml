model:
  name: two_view_pipeline
  extractor:
    name: extractors.mixed
    trainable: false
    detector:
      name: extractors.raco
      trainable: false
      weights: https://github.com/cvg/RaCo/releases/download/v1.0.0/raco.pth
      max_num_keypoints: 2048
    descriptor:
      name: extractors.aliked_descriptor
      trainable: false
      model_name: aliked-n16
  matcher:
    name: matchers.lightglue_pretrained
    features: raco-aliked
    depth_confidence: -1
    width_confidence: -1
    filter_threshold: 0.1
benchmarks:
  megadepth1500:
    data:
      preprocessing:
        side: long
        resize: 1600
    eval:
      estimator: opencv
      ransac_th: 0.5
  hpatches:
    eval:
      estimator: opencv
      ransac_th: 0.5
    model:
      extractor:
        detector:
          max_num_keypoints: 1024
